[package]
name = "hashibuild"
version = "0.0.0"
description = "Content hash for a git source subtree plus its lock files, with hash-keyed build caching"
license = "MIT"
repository = "https://github.com/vivainio/hashibuild-rs"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
